[project]
name = "openweight-responses-api"
version = "0.1.0"
description = "Production-ready ROCm-first inference gateway for open-weight reasoning models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.0",
  "httpx==0.28.1",
  "prometheus-client==0.23.1",
  "pydantic-settings==2.11.0",
  "python-json-logger==4.0.0",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
  "pyyaml==6.0.3",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "respx==0.22.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
