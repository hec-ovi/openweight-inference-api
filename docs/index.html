<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenWeight Responses API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      :root {
        --bg: #f4efe4;
        --panel: rgba(255, 252, 246, 0.9);
        --ink: #1f2521;
        --accent: #a5482c;
        --accent-soft: #e8c4ab;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #f7d9be 0, transparent 32%),
          radial-gradient(circle at bottom right, #d8ebdf 0, transparent 28%),
          var(--bg);
      }

      header {
        padding: 2.5rem 1.5rem 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 52rem;
        font-size: 1rem;
      }

      .shell {
        margin: 0 auto 2rem;
        width: min(1100px, calc(100vw - 2rem));
        border: 1px solid rgba(31, 37, 33, 0.12);
        border-radius: 24px;
        overflow: hidden;
        backdrop-filter: blur(18px);
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(49, 37, 19, 0.12);
      }

      .bar {
        display: flex;
        gap: 0.5rem;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid rgba(31, 37, 33, 0.08);
      }

      .dot {
        width: 0.9rem;
        height: 0.9rem;
        border-radius: 999px;
        background: var(--accent-soft);
      }

      .dot:nth-child(1) {
        background: #de7f5b;
      }

      .dot:nth-child(2) {
        background: #d8b45a;
      }

      .dot:nth-child(3) {
        background: #7aaa7b;
      }

      #swagger-ui {
        padding-bottom: 2rem;
      }

      .swagger-ui .topbar {
        display: none;
      }

      .links {
        padding: 0 1.5rem 1.5rem;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .links a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>OpenWeight Responses API</h1>
      <p>
        ROCm-first OpenAI-compatible inference gateway for `gpt-oss`, Qwen 3, and DeepSeek R1 Distill. This static docs site stays GitHub Pages friendly and reads the generated `openapi.json` directly.
      </p>
    </header>
    <main class="shell">
      <div class="bar">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="links">
        <a href="./redoc.html">ReDoc</a>
        <a href="./examples.html">Examples</a>
        <a href="./streaming.html">Streaming</a>
      </div>
      <div id="swagger-ui"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        persistAuthorization: true,
      });
    </script>
  </body>
</html>
