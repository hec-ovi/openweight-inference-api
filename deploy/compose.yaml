services:
  gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: openweight-gateway:0.1.0
    environment:
      API_BEARER_KEYS: ${API_BEARER_KEYS}
      APP_ENV: ${APP_ENV:-production}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      MODEL_PROFILE: ${MODEL_PROFILE:-gpt-oss}
      VLLM_BASE_URL: http://vllm:8000
      VLLM_REQUEST_TIMEOUT_SECONDS: ${VLLM_REQUEST_TIMEOUT_SECONDS:-120}
      VLLM_STREAM_TIMEOUT_SECONDS: ${VLLM_STREAM_TIMEOUT_SECONDS:-900}
      REQUEST_MAX_BODY_BYTES: ${REQUEST_MAX_BODY_BYTES:-1048576}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://localhost:8080}
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - openweight

  vllm:
    build:
      context: ..
      dockerfile: deploy/vllm/stable/Dockerfile
    image: openweight-vllm:rocm7.2-stable
    environment:
      HF_TOKEN: ${HF_TOKEN}
      MODEL_PROFILE: ${MODEL_PROFILE:-gpt-oss}
      MODEL_CACHE_DIR: /models/vllm
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-32768}
      VLLM_DTYPE: ${VLLM_DTYPE:-auto}
      VLLM_ENFORCE_EAGER: ${VLLM_ENFORCE_EAGER:-0}
    devices:
      - /dev/kfd
      - /dev/dri
    ports:
      - "8001:8000"
    volumes:
      - ${MODEL_CACHE_DIR:-/var/lib/openweight/models/vllm}:/models/vllm
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 15m
    restart: unless-stopped
    shm_size: "16gb"
    networks:
      - openweight

networks:
  openweight:
    driver: bridge
