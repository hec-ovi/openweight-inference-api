apiVersion: v1
kind: Service
metadata:
  name: openweight-gateway
spec:
  type: ClusterIP
  selector:
    app: openweight-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: openweight-vllm
spec:
  type: ClusterIP
  selector:
    app: openweight-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http

